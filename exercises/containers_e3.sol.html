<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div cat exercise</title>

    <style>
        div {
            width: 200px;
            /* add shadow on all sides */
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            display: inline-block;
            margin-right: 20px;
        }

        p {
            margin: 7px;
        }

        img {
            width: 100%;
            height: 200px;
        }

        button {
            /* rounded corners */
            border-radius: 4px;
            color: white;
            padding-top: 10px;
          	padding-bottom: 10px;
            padding-left:20px;
            padding-right:20px;
            margin: 10px;
            background-color: #2e5fbb;
            border: none;
        }
      
      .mutual-friends{
      		color: gray; 
        	font-size: 15px;
        	font-weight: 600;
      	}
      
      .profile-name{
        	font-size: 18px;
        	font-weight: 800;
      	}
      
      	p {
          	font-family: Arial;
      	}
      
    </style>
  </head>

<body>
    <div>
        <img src="https://images.pexels.com/photos/45201/kitty-cat-kitten-pet-45201.jpeg?cs=srgb&dl=pexels-pixabay-45201.jpg&fm=jpg"
            alt="Cat 1">
        <p class="profile-name" style="font-weight: bold;">Oliver</p>
        <p class="mutual-friends">2 mutual friends</p>
        <button>Add Friend</button>
    </div>

    <div>
        <img src="https://images.squarespace-cdn.com/content/v1/5e8a2944d7ce562e250eb009/1596031205878-H7PYXVSW2M2GUH3LZZSD/cocoandfritz.jpg"
            alt="Cat 1">
        <p class="profile-name" style="font-weight: bold;">Mimi</p>
        <p class="mutual-friends">3 mutual friends</p>
        <button>Add Friend</button>
    </div>

    <div>
        <img src="https://hips.hearstapps.com/hmg-prod/images/chihuahua-dog-running-across-grass-royalty-free-image-1580743445.jpg?crop=0.66658xw:1xh;center,top"
            alt="Cat 1">
        <p class="profile-name" style="font-weight: bold;">Rex</p>
        <p class="mutual-friends">4 mutual friends</p>
        <button>Add Friend</button>
    </div>
</body>

</html>
