<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TABLE - E1</title>
  <style>
    table {
      border-collapse: collapse;
      width: 400px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
    th {
      background-color: lightblue;
    }
    tr:nth-child(even) td {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Status</th>
    </tr>
    <tr>
      <td>Alice</td>
      <td><i>Developer</i></td>
      <td style="color: green; font-weight: bold;">Active</td>
    </tr>
    <tr>
      <td>Bob</td>
      <td><b>Designer</b></td>
      <td style="color: red;">Inactive</td>
    </tr>
    <tr>
      <td>Carol</td>
      <td><u>Manager</u></td>
      <td style="background-color: yellow;">On Leave</td>
    </tr>
  </table>

</body>
</html>
