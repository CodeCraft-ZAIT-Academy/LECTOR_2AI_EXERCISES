<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTML Exercises</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css" />
</head>
<body>
  <header>
    <div class="brand">HTML exercises</div>
    <nav id="exerciseNav" aria-label="Exercise categories"></nav>
    <div class="header-actions">
      <button id="resetBtn" type="button">Reset</button>
      <button id="solutionBtn" type="button" disabled>View solution</button>
    </div>
  </header>

  <div id="exerciseBar">
    <div>
      <span class="eyebrow">Current exercise</span>
      <h1 id="exerciseTitle">Choose an exercise</h1>
    </div>
    <span id="saveStatus" role="status">Nothing loaded</span>
  </div>

  <main id="main">
    <div id="editor"></div>
    <div id="right">
      <div id="description"></div>
      <div id="preview"><iframe id="output" title="Exercise preview"></iframe></div>
    </div>
  </main>

  <dialog id="solutionDialog">
    <div class="dialog-header">
      <h2>Solution</h2>
      <button id="closeSolutionBtn" type="button">Close</button>
    </div>
    <pre id="solutionCode"><code></code></pre>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="exercises/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
